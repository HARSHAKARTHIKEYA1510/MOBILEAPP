services:
  - type: web
    name: nova-chat-backend
    runtime: node
    rootDir: chat-app
    plan: free
    buildCommand: npm install && npx prisma generate
    startCommand: node server/index.mjs
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
